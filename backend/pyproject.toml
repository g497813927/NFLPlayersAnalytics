[project]
name = "nfl-players-analytics"
version = "0.1.0"
description = "A synthetic football analytics database prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "pwdlib[argon2]>=0.3,<1",
  "email-validator>=2.2,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
